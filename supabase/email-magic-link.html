<!-- Supabase → Authentication → Emails → "Magic Link" (and the same for "Confirm signup").
     Subject: Your sign-in · Η σύνδεσή σου · Dein Login · Вход — Train with Kyri -->
<div style="background:#0b0b0c;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:#f5f5f3">
  <div style="max-width:460px;margin:0 auto;background:#16171a;border:1px solid #2a2b30;border-radius:18px;padding:28px 24px;text-align:center">
    <img src="{{ .SiteURL }}/logo.png" alt="KYRI" width="56" style="display:block;margin:0 auto 12px">
    <div style="font-size:24px;font-weight:800;font-style:italic;letter-spacing:.5px">TRAINWITH<span style="color:#f26b2a">KYRI</span></div>
    <p style="color:#c9cacd;font-size:15px;line-height:1.5;margin:18px 0 6px">Tap the button to sign in · Πάτα το κουμπί για σύνδεση<br>Zum Anmelden tippen · Нажми, чтобы войти</p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;margin:14px 0;background:#f26b2a;color:#140a03;text-decoration:none;font-weight:800;font-size:16px;padding:14px 28px;border-radius:14px">Sign in · Σύνδεση</a>
    <p style="color:#a3a5ab;font-size:13px;margin:14px 0 4px">Or enter this code · Ή γράψε αυτόν τον κωδικό · Oder Code eingeben · Или введи код</p>
    <div style="font-family:Menlo,Consolas,monospace;font-size:28px;letter-spacing:8px;font-weight:700;color:#f5f5f3">{{ .Token }}</div>
    <p style="color:#8d8f95;font-size:12px;margin-top:22px">If you didn't ask for this, just ignore this e-mail.</p>
  </div>
</div>
